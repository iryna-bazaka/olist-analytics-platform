[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-analytics-platform"
version = "0.1.0"
description = "SQL-first semantic analytics platform for the Olist Brazilian e-commerce dataset"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.30",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
